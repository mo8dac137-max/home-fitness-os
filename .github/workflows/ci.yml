name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow token can only read the repository.
permissions:
  contents: read

# One run per ref: a new push to the same branch cancels its superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Performance Budget Check
        run: set -o pipefail && npm run check:bundle | tee "$GITHUB_STEP_SUMMARY"
